name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/Dockerfile
          build-contexts: tofu=tofu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencloud:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/opencloud:latest

      - name: Build and push the Caddy image
        uses: docker/build-push-action@v6
        with:
          context: platform/images/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencloud-caddy:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/opencloud-caddy:latest

      # The "latest" copy lets install.sh use the fixed URL releases/latest/download/opencloud-latest.tar.gz.
      - name: Build the release archives
        run: |
          tests/e2e/build-release-archive.sh "$GITHUB_REF_NAME" dist
          tests/e2e/build-release-archive.sh latest dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/opencloud-${{ github.ref_name }}.tar.gz
            dist/opencloud-${{ github.ref_name }}.tar.gz.sha256
            dist/opencloud-latest.tar.gz
            dist/opencloud-latest.tar.gz.sha256
            install.sh
