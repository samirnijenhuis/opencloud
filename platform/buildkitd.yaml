apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd
  namespace: opencloud
data:
  buildkitd.toml: |
    [registry."registry.opencloud.svc.cluster.local:5000"]
      http = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: opencloud
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/part-of: opencloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
        app.kubernetes.io/part-of: opencloud
    spec:
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.25.1
          imagePullPolicy: IfNotPresent
          # Only the Unix socket. The dashboard reaches BuildKit through kubectl exec, so no pod can reach it over the network.
          args:
            - --addr
            - unix:///run/buildkit/buildkitd.sock
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command: [buildctl, debug, workers]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit
            - name: state
              mountPath: /var/lib/buildkit
      volumes:
        - name: config
          configMap:
            name: buildkitd
        - name: state
          hostPath:
            path: /var/lib/opencloud/buildkit
            type: DirectoryOrCreate
