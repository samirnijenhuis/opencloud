apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencloud-dashboard
  namespace: opencloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencloud-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: opencloud-dashboard
    namespace: opencloud
