apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: opencloud
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: opencloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: opencloud
    spec:
      containers:
        - name: registry
          image: registry:3
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          hostPath:
            path: /var/lib/opencloud/registry
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: opencloud
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/part-of: opencloud
spec:
  # The node pulls through /etc/rancher/k3s/registries.yaml, which points at this fixed IP because the node cannot resolve cluster DNS.
  clusterIP: 10.43.200.200
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
